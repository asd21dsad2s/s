<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GymLite - Ultra-Fast Workout Tracker</title>
    <meta name="description" content="Ultra-lightweight, zero-bloat workout logger and rest timer built for Android and web. 100% offline, synthesized Web Audio chimes, zero accounts, and instant response." />
    
    <!-- OpenGraph & Social -->
    <meta property="og:title" content="GymLite - Ultra-Fast Workout Tracker" />
    <meta property="og:description" content="Ultra-lightweight, zero-bloat workout logger and rest timer built for Android and web. 100% offline, synthesized Web Audio chimes, zero accounts, and instant response." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GymLite" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body class="bg-[#09090b] text-[#f4f4f5] antialiased selection:bg-emerald-500 selection:text-black min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for offline caching and PWA installation
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => {
              console.log('GymLite SW registered with scope:', reg.scope);
            })
            .catch(err => {
              console.warn('GymLite SW registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
